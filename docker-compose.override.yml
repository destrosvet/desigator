# ============================================
# Přepis pro lokální vývoj
# Přidává MinIO pro lokální S3 testování
# ============================================
# Použití:
#   cp .env.example .env.local   # nebo nastav hodnoty ručně
#   docker compose up -d
#
# MinIO console: http://localhost:9001 (minioadmin / minioadmin)
# ============================================

services:
  minio:
    image: ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z@sha256:69b55a1c1c5dc285ce04db96689f5b2102317fc77a50680a1874ca6efd1c87f9
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD-SHELL", "mc alias set health http://127.0.0.1:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD >/dev/null && mc ready health"]
      interval: 10s
      timeout: 5s
      retries: 5

  createbuckets:
    image: ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z@sha256:69b55a1c1c5dc285ce04db96689f5b2102317fc77a50680a1874ca6efd1c87f9
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -ec "
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb myminio/desigator-uploads --ignore-existing;
      /usr/bin/mc anonymous set none myminio/desigator-uploads;
      exit 0;
      "

  app:
    environment:
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: desigator-uploads
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_FORCE_PATH_STYLE: "true"
      S3_PUBLIC_URL: http://localhost:9000/desigator-uploads
    depends_on:
      createbuckets:
        condition: service_completed_successfully

volumes:
  minio_data:
