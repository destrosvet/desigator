name: Validate application
on: [push, pull_request]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: desigator_ci
          POSTGRES_DB: desigator_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d desigator_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:desigator_ci@localhost:5432/desigator_ci
      AUTH_SECRET: isolated-ci-secret-not-for-production-32-characters
      NEXTAUTH_URL: http://127.0.0.1:3100
      E2E_SERVER_COMMAND: node .next/standalone/server.js
      PORT: 3100
      HOSTNAME: 127.0.0.1
      E2E_ORGANIZATIONS: 'true'
      E2E_PLATFORM_ROLES: 'true'
      E2E_PLATFORM_DATABASE_URL: postgresql://postgres:desigator_ci@localhost:5432/desigator_ci
      E2E_STATISTICS: 'true'
      E2E_STATISTICS_DATABASE_URL: postgresql://postgres:desigator_ci@localhost:5432/desigator_ci
      E2E_WORKFLOW: 'true'
      E2E_MEDIA: 'true'
      E2E_PASSWORDS: 'true'
      E2E_PUBLICATION: 'true'
      E2E_PUBLIC_RESULTS: 'true'
      E2E_PUBLIC_RESULTS_DATABASE_URL: postgresql://postgres:desigator_ci@localhost:5432/desigator_ci
      E2E_PUBLICATION_DATABASE_URL: postgresql://postgres:desigator_ci@localhost:5432/desigator_ci
      E2E_PASSWORDS_DATABASE_URL: postgresql://postgres:desigator_ci@localhost:5432/desigator_ci
      APP_URL: http://127.0.0.1:3100
      S3_ENDPOINT: http://127.0.0.1:19000
      S3_REGION: us-east-1
      S3_BUCKET: desigator-audit
      S3_ACCESS_KEY_ID: desigator_audit
      S3_SECRET_ACCESS_KEY: desigator_audit_storage
      S3_FORCE_PATH_STYLE: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npx prisma migrate deploy
      - run: npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code
      - run: npm run db:seed
      - run: npx tsx tests/helpers/seed-statistics.ts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - run: npm run build
      - name: Start isolated private image storage
        run: |
          docker run -d --name desigator-ci-storage -p 127.0.0.1:19000:9000 -e MINIO_ROOT_USER=desigator_audit -e MINIO_ROOT_PASSWORD=desigator_audit_storage ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z@sha256:69b55a1c1c5dc285ce04db96689f5b2102317fc77a50680a1874ca6efd1c87f9 server /data
          for attempt in {1..30}; do
            if docker exec desigator-ci-storage mc alias set audit http://127.0.0.1:9000 desigator_audit desigator_audit_storage; then break; fi
            sleep 2
          done
          docker exec desigator-ci-storage mc ready audit
          docker exec desigator-ci-storage mc mb audit/desigator-audit
          docker exec desigator-ci-storage mc anonymous set none audit/desigator-audit
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
