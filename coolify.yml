services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      DATABASE_URL: postgresql://desigator:${SERVICE_PASSWORD_64_POSTGRES}@postgres:5432/desigator
      AUTH_SECRET: ${AUTH_SECRET:?required}
      NEXTAUTH_SECRET: ${AUTH_SECRET:?required}
      AUTH_URL: ${APP_URL:?required}
      NEXTAUTH_URL: ${APP_URL:?required}
      APP_URL: ${APP_URL:?required}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-Administrator}
      S3_ENDPOINT: ${S3_ENDPOINT:?required}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:?required}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?required}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?required}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      RESEND_API_KEY: ${RESEND_API_KEY:?required}
      RESEND_FROM: ${RESEND_FROM:?required}
    depends_on:
      postgres: { condition: service_healthy }
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: desigator
      POSTGRES_USER: desigator
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_64_POSTGRES}
    volumes: [desigator_postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U desigator -d desigator"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  desigator_postgres:
